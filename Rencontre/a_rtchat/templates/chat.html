{% extends 'blank.html' %}

{% block content %}

<wrapper class="wrapper">
    <div id="chat_window" class="chat_window">
        <div class="chat-header">
            <span id="online-count" class="pr-1">3</span>online
        </div>
        <div id='chat_container' class="chat-container">
            <ul id='chat_messages' class="chat-messages">
                {% for messages in chat_messages reversed%}
                {% include 'chat_message.html'%}
                
                {%endfor %}
            </ul>
        </div>
        <div class="chat-input">
                <form id="chat_message_form"  class="w-full" 
                    hx-post ="{% url 'chat_home' %}"
                    hx-target="#chat_messages"
                    hx-swap="beforeend">
                    {% csrf_token %}
                    {{form}}
                </form>
            </div>
        </div>
    </div>
</wrapper>

{% endblock %}
