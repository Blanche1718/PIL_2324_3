<!DOCTYPE html>
<html>
<head>
    <title>Suggestions de restaurants</title>
</head>
<body>
    <h1>Suggestions de restaurants</h1>
    
    <form method="post" action="{% url 'restaurant' %}">
        {% csrf_token %}
        <label for="budget">Budget :</label>
        <select name="budget" id="budget">
            <option value="Bon marché">Bon marché</option>
            <option value="Modéré">Modéré</option>
            <option value="Cher">Cher</option>
        </select>
        
        <label for="cuisine_type">Type de cuisine :</label>
        <select name="cuisine_type" id="cuisine_type">
            <option value="Italienne">Italienne</option>
            <option value="Française">Française</option>
            <option value="Indienne">Indienne</option>
            <option value="Tout">Tout</option>
            <!-- Add more options as needed -->
        </select>
        
        <button type="submit">Suggérer</button>
    </form>
    
</body>
</html>
