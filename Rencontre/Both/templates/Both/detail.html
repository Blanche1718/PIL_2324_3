{%extends "base.html"%}
{% block content %}

<style>
    .forms{
        border: 1px solid slateblue;
        width: 100%;
        border-radius: 5px;
        padding: 10px 10px;
        font-size: 18px;
    }
</style>

<div class="chat-container2">
    <div class="identity">
        <div>
            <a href="{% url 'chats' %}">
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="currentColor" class="bi bi-house" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M8 3.293l-6 6V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V9.293l-6-6zM7 13V9.5H9V13H7z"/>
                    <path fill-rule="evenodd" d="M8 2.293l6 6V13.5A2.5 2.5 0 0 1 11.5 16h-9A2.5 2.5 0 0 1 0 13.5V8.293l6-6a1 1 0 0 1 1.415 0L8 2.293z"/>
                </svg>
            </a>
        </div>
        <h3>{{friend.profile.user.username}}</h3>
        <div class="pro-pic">
            <img src="{{friend.profile.photo.url}}" alt="profile-picture">
        </div>
    </div>
    <div class="sub-container">
        <div class="chat-body" id="chat-body">
            <div class="chat-box-sent" id="chat-box-sent" style="display: none;"></div>
        </div>
        <form action="" id="myform" method="POST">
            {{form}}
            <button type="submit" id="submit">Send</button>
        </form>
    </div>

</div>

{%endblock%}
