<!DOCTYPE html>
<html>
<head>
    <title>Suggestions</title>
</head>
<body>
    <h2>Suggestions de partenaires</h2>
    <ul>
        {% for suggestion in suggestions %}
            <li>
                <a href="{% url 'user_detail' suggestion.pk %}">{{ suggestion.user.first_name }} {{ suggestion.user.last_name }}</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
