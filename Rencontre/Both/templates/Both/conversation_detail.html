{% extends 'base.html' %}

{% block content %}
<h2>Conversation</h2>
<div id="messages">
    {% for message in messages %}
    <div class="message">
        <strong>{{ message.sender.username }}:</strong> {{ message.content }} <em>{{ message.timestamp }}</em>
    </div>
    {% endfor %}
</div>
<form id="messageForm">
    {% csrf_token %}
    <input type="hidden" name="conversation_id" value="{{ conversation.id }}">
    <textarea name="message_content" id="message_content" required></textarea>
    <button type="submit">Envoyer</button>
</form>

<script>
document.getElementById('messageForm').onsubmit = function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    fetch("{% url 'send_message' %}", {
        method: 'POST',
        body: formData,
        headers: {
            'X-CSRFToken': formData.get('csrfmiddlewaretoken')
        }
    }).then(response => response.json()).then(data => {
        if (data.status === 'success') {
            const newMessage = document.createElement('div');
            newMessage.className = 'message';
            newMessage.innerHTML = `<strong>${ request.user.username }:</strong> ${data.message} <em>${data.timestamp}</em>`;
            document.getElementById('messages').appendChild(newMessage);
            document.getElementById('message_content').value = '';
        }
    });
};

</script>
{% endblock %}
