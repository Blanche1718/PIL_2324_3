<!DOCTYPE html>
<html>
<head>
    <title>Résultats de la recherche</title>
</head>
<body>
    <h1>Résultats de la recherche</h1>
    
    {% if restaurants %}
        <ul>
            {% for restaurant in restaurants %}
                <li>
                    <h3>{{ restaurant.name }}</h3>
                    <p><a href="{{ restaurant.website_url }}">Site du restaurant</a></p>
                    <img src="{{ restaurant.photo_url }}" alt="{{ restaurant.name }} photo">
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Aucun restaurant trouvé pour ces critères.</p>
    {% endif %}
    
    <p><a href="{% url 'restaurant_search' %}">Nouvelle recherche</a></p>
</body>
</html>
