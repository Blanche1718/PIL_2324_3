<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Restaurants</title>
</head>
<body>
    <h1>Liste des Restaurants</h1>
    <ul>
        {% for restaurant in restaurants %}
            <li>{{ restaurant.name }} - Cuisine: {{ restaurant.preferred_cuisine }}, Budget: {{ restaurant.budget_level }}</li>
        {% endfor %}
    </ul>
</body>
</html>
